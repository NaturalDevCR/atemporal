# .github/dependabot.yml
# GitHub-native Dependabot. Keeps runtime dependencies and the dev toolchain
# current without manual PRs. See docs/adr/0007-supply-chain-hardening.md.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 8
    versioning-strategy: "increase"
    # Keep routine version updates on patch and minor releases.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # VitePress's Vite override is maintained in pnpm-workspace.yaml.
    # Group related deps so we get one PR instead of five.
    groups:
      temporal-polyfill:
        patterns:
          - "@js-temporal/polyfill"
      typescript:
        patterns:
          - "typescript"
          - "ts-*"
      jest:
        patterns:
          - "jest"
          - "@types/jest"
          - "ts-jest"
      build:
        patterns:
          - "tsup"
          - "esbuild"
          - "rollup"
          - "rolldown"
      vitepress:
        patterns:
          - "vitepress"
          - "vue"
      mutation:
        patterns:
          - "@stryker-mutator/*"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
