name: Release (release-please)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Version from package.json to validate and publish through trusted publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-release:
    name: Select the release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the manifest and existing tag
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./.release-please-manifest.json')['.']")"
          test "$package_version" = "$manifest_version"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable SemVer package version' >&2
            exit 1
          fi

          tag_ref="refs/tags/v${package_version}"
          release_sha="$(git log -1 --first-parent --format=%H -- .release-please-manifest.json)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$RELEASE_VERSION" = "$package_version"
            if git show-ref --verify --quiet "$tag_ref"; then
              release_sha="$(git rev-parse "${tag_ref}^{commit}")"
            fi
          elif git show-ref --verify --quiet "$tag_ref"; then
            exit 0
          fi

          test -n "$release_sha"
          git show "${release_sha}:package.json" | node -e 'const fs = require("node:fs"); if (JSON.parse(fs.readFileSync(0, "utf8")).version !== process.argv[1]) process.exit(1)' "$package_version"
          printf 'version=%s\nsha=%s\n' "$package_version" "$release_sha" >> "$GITHUB_OUTPUT"

  release-please:
    name: Prepare the release PR
    needs: plan-release
    if: github.event_name == 'push' && needs.plan-release.outputs.version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  release-validation:
    name: Validate the release tarball
    needs: plan-release
    if: needs.plan-release.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan-release.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build
        id: build
        continue-on-error: true
        run: pnpm run build
      - name: Pack exactly one npm artifact
        id: pack
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: pnpm run pack:artifact
      - name: Unit and coverage gates
        id: unit
        continue-on-error: true
        run: pnpm run test:ci --runInBand
      - name: Contract fixture gate
        id: contracts
        if: always() && steps.pack.outcome == 'success'
        continue-on-error: true
        run: pnpm run fixtures:contract
      - name: Extended fixture gate
        id: extended
        if: always() && steps.pack.outcome == 'success'
        continue-on-error: true
        run: pnpm run fixtures:extended
      - name: Contractual core and canonical size gates
        id: size
        if: always() && steps.pack.outcome == 'success'
        continue-on-error: true
        run: node scripts/measure-release-artifact.cjs
      - name: Capture hosted performance candidate
        id: benchmark
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: node --expose-gc -r ts-node/register/transpile-only benchmarks/bench.ts 100000 > bench-out.json
      - name: Gate against the reviewed baseline
        id: performance
        if: always() && steps.benchmark.outcome == 'success'
        continue-on-error: true
        run: pnpm run bench:gate
      - name: Upload release package artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-package-artifact
          path: |
            artifacts/atemporal-*.tgz
            artifacts/package-artifact.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-evidence
          path: |
            reports/
            reports/bundler-diagnostics/
            integration/canonical-bundle/dist/*.meta.json
            coverage/
            bench-out.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload explicit reviewed performance baseline-capture artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reviewed-performance-baseline-capture
          path: bench-out.json
          if-no-files-found: warn
          retention-days: 90
      - name: Fail after preserving validation evidence
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.pack.outcome }}" = success
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.contracts.outcome }}" = success
          test "${{ steps.extended.outcome }}" = success
          test "${{ steps.size.outcome }}" = success
          test "${{ steps.benchmark.outcome }}" = success
          test "${{ steps.performance.outcome }}" = success

  publish-npm:
    name: Publish validated tarball to npm
    needs: [plan-release, release-validation]
    if: needs.plan-release.outputs.version != '' && needs.release-validation.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan-release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          registry-url: https://registry.npmjs.org
      - name: Download the validated package artifact
        uses: actions/download-artifact@v8
        with:
          name: release-package-artifact
          path: artifacts
      - name: Verify validated artifact metadata
        env:
          RELEASE_VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const artifact = require('./artifacts/package-artifact.json');
          assert.equal(artifact.path, './artifacts/atemporal-' + process.env.RELEASE_VERSION + '.tgz');
          const digest = createHash('sha512').update(readFileSync(artifact.path)).digest('base64');
          assert.equal(digest, artifact.sha512);
          NODE
      - name: Publish the validated tarball through npm trusted publishing
        env:
          RELEASE_VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          if published_integrity="$(npm view "atemporal@${RELEASE_VERSION}" dist.integrity)" && [ -n "$published_integrity" ]; then
            artifact_integrity="sha512-$(node -p "require('./artifacts/package-artifact.json').sha512")"
            if [ "$published_integrity" != "$artifact_integrity" ]; then
              echo "Published atemporal@${RELEASE_VERSION} differs from the validated tarball." >&2
              exit 1
            fi
            echo "The validated tarball for atemporal@${RELEASE_VERSION} is already published."
            exit 0
          fi
          npm publish "$(node -p "require('./artifacts/package-artifact.json').path")" --access public --tag latest

  attach-sbom:
    name: Finalize GitHub Release and attach SBOM
    needs: [plan-release, publish-npm]
    if: needs.plan-release.outputs.version != '' && needs.publish-npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan-release.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: mkdir -p sbom && pnpm sbom --sbom-format=spdx --lockfile-only --out sbom/atemporal.spdx.json
      - run: pnpm sbom --sbom-format=cyclonedx --lockfile-only --out sbom/atemporal.cdx.json
      - name: Extract the validated version's changelog
        id: notes
        env:
          RELEASE_VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$RELEASE_VERSION" '
            /^## / {
              if (section) exit
              section = index($0, "## [" version "]") == 1
            }
            section
          ' CHANGELOG.md > "$notes"
          if [ -s "$notes" ]; then
            printf 'path=%s\n' "$notes" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan-release.outputs.version }}
          target_commitish: ${{ needs.plan-release.outputs.sha }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: |
            sbom/atemporal.spdx.json
            sbom/atemporal.cdx.json
          fail_on_unmatched_files: true
      - name: Mark the merged release PR as tagged
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.plan-release.outputs.sha }}
        run: |
          pull_requests="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" --jq \
            '.[] | select(.merged_at and .base.ref == "main" and any(.labels[]; .name == "autorelease: pending")) | .number')"
          for pull_request in $pull_requests; do
            gh pr edit "$pull_request" --repo "$GITHUB_REPOSITORY" \
              --add-label 'autorelease: tagged' --remove-label 'autorelease: pending'
          done
