allowBuilds:
  # jest-haste-map 30.5 pulls in @parcel/watcher for watch mode only; its
  # prebuilt platform binaries ship as optional deps, so the build script is
  # never needed in CI or tests.
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true
overrides:
  '@babel/core@^7.0.0': 7.29.7
  'brace-expansion@^1.1.0': 1.1.21
  'brace-expansion@^2.0.0': 2.1.7
  'brace-expansion@^5.0.0': 5.0.12
  electron-to-chromium: 1.5.368
  baseline-browser-mapping: 2.11.28
  browserslist: 4.29.3
  fast-uri: 3.1.9
  handlebars: 4.7.10
  js-yaml: 3.15.2
  'nanoid@^3.3.0': 3.3.20
  postcss: 8.5.29
  qs: 6.16.0
  source-map-js: 1.2.2
  tmp: 0.2.7
  tsup>esbuild: 0.28.1
  vitepress>vite: 6.4.4
  zod: 4.6.7
packageExtensions:
  vite@6.4.4:
    dependencies:
      esbuild: 0.25.12
